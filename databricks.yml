bundle:
  name: nordpool-electricity-prices

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog
    default: workspace

  schema_name:
    description: Environment-specific target schema
    default: nordpool_dev

  landing_table:
    description: Elering API data landing table
    default: landing_nordpool_api_batches  

  window_days_back:
    description: Number of days before today
    default: "2"

  window_days_forward:
    description: Number of days after today
    default: "2"

  api_base_url:
    description: Elering API endpoint
    default: https://dashboard.elering.ee/api/nps/price

  pipeline_development:
    description: Lakeflow pipeline development mode
    default: "true"

  schedule_pause_status:
    description: Job schedule state
    default: PAUSED

  alert_email:
    description: Email recipient for failed production workflow notifications    

targets:
  dev:
    default: true

    variables:
      catalog: workspace
      schema_name: nordpool_dev
      window_days_back: "2"
      window_days_forward: "2"
      api_base_url: https://dashboard.elering.ee/api/nps/price
      pipeline_development: "true"
      schedule_pause_status: PAUSED

  staging:
    mode: production

    variables:
      catalog: workspace
      schema_name: nordpool_staging
      window_days_back: "2"
      window_days_forward: "2"
      api_base_url: https://dashboard.elering.ee/api/nps/price
      pipeline_development: "false"
      schedule_pause_status: PAUSED      

  prod:
    mode: production

    variables:
      catalog: workspace
      schema_name: nordpool
      window_days_back: "2"
      window_days_forward: "2"
      api_base_url: https://dashboard.elering.ee/api/nps/price
      pipeline_development: "false"
      schedule_pause_status: UNPAUSED
      
    resources:
      jobs:
        nordpool_daily_job:
          email_notifications:
            on_failure:
              - ${var.alert_email}

          notification_settings:
            no_alert_for_skipped_runs: true      