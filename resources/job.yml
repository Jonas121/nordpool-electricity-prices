resources:
  jobs:
    nordpool_daily_job:
      name: nordpool-daily-${bundle.target}
      schedule:
        quartz_cron_expression: 0 0 15 * * ?
        timezone_id: Europe/Vilnius
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_api_to_landing
          max_retries: 2
          min_retry_interval_millis: 900000
          retry_on_timeout: true
          spark_python_task:
            python_file: ../src/ingest_nordpool_landing.py
            parameters:
              - --landing-table
              - ${var.catalog}.${var.schema_name}.${var.landing_table}
              - --days-back
              - ${var.window_days_back}
              - --days-forward
              - ${var.window_days_forward}
              - --api-base-url
              - ${var.api_base_url}
          environment_key: default

        - task_key: refresh_lakeflow_pipeline
          depends_on:
            - task_key: ingest_api_to_landing
          max_retries: 1
          min_retry_interval_millis: 900000
          retry_on_timeout: true              
          pipeline_task:
            pipeline_id: ${resources.pipelines.nordpool_pipeline.id}
      environments:
        - environment_key: default
          spec:
            client: "2"