resources:
  pipelines:
    nordpool_pipeline:
      name: nordpool-${bundle.target}
      catalog: ${var.catalog}
      target: ${var.schema_name}
      serverless: true
      development: ${var.pipeline_development}
      continuous: false
      photon: true
      libraries:
        - file:
            path: ../src/pipelines/bronze_nordpool.py
        - file:
            path: ../src/pipelines/silver_nordpool.py
      configuration:
        nordpool.landing_table: ${var.catalog}.${var.schema_name}.${var.landing_table}
        nordpool.window_days_back: ${var.window_days_back}
        nordpool.window_days_forward: ${var.window_days_forward}
        nordpool.api_base_url: ${var.api_base_url}